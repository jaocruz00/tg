spring.application.name=tg
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads/documentos}
app.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.ollama.modelo=${OLLAMA_MODEL:qwen2.5vl:latest}
app.ollama.allowed-models=${OLLAMA_ALLOWED_MODELS:qwen2.5vl:latest}
app.ollama.cloudflare.client-id=${CF_ACCESS_CLIENT_ID:}
app.ollama.cloudflare.client-secret=${CF_ACCESS_CLIENT_SECRET:}
app.openrouter.key=${OPENROUTER_API_KEY:}
server.error.include-message=never
server.error.include-stacktrace=never
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
