spring.application.name=tg
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tg}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
app.upload-dir=${UPLOAD_DIR:./uploads/documentos}
app.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,https://jaocruz00.github.io}
app.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.ollama.modelo=${OLLAMA_MODEL:qwen2.5vl:latest}
app.ollama.allowed-models=${OLLAMA_ALLOWED_MODELS:qwen2.5vl:latest,llama3.2-vision:11b,glm-ocr:latest}
app.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
app.ollama.access-id=${CF_ACCESS_CLIENT_ID:}
app.ollama.access-secret=${CF_ACCESS_CLIENT_SECRET:}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
